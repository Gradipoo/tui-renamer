name: Release

on:
  push:
    branches: ["release/*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release ref
        id: release
        run: python packaging/release_ref.py

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rn-linux-x86_64
          - os: windows-latest
            artifact: rn-windows-x64.exe
          - os: macos-latest
            artifact: rn-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[heif]" pyinstaller
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          MAIN=$(python -c "import tui_renamer.__main__ as entry; print(entry.__file__)")
          pyinstaller --noconfirm --clean --onefile --name rn \
            --collect-all textual \
            --collect-all textual_image \
            --collect-all rich \
            --collect-all tzdata \
            --collect-all pillow_heif \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import piexif \
            --hidden-import zoneinfo \
            --hidden-import pillow_heif \
            "$MAIN"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv dist/rn.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/rn "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true

  pypi:
    if: needs.prepare.outputs.publish == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
