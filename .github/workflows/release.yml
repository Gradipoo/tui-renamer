name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rn-linux-x86_64
          - os: windows-latest
            artifact: rn-windows-x64.exe
          - os: macos-latest
            artifact: rn-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          MAIN=$(python -c "import tui_renamer.__main__ as entry; print(entry.__file__)")
          pyinstaller --noconfirm --clean --onefile --name rn \
            --collect-all textual \
            --collect-all textual_image \
            --collect-all rich \
            --collect-all tzdata \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import piexif \
            --hidden-import zoneinfo \
            "$MAIN"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv dist/rn.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/rn "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
